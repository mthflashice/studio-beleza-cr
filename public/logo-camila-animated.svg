<svg width="200" height="200" viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A2B8"/>
      <stop offset="100%" stop-color="#6B8F71"/>
    </linearGradient>
  </defs>

  <path
    d="M130 40 C90 20, 40 55, 40 100 C40 145, 90 180, 130 160"
    fill="none"
    stroke="url(#cgGradient)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    pathLength="1"
    stroke-dasharray="1"
    stroke-dashoffset="1"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="1"
      to="0"
      dur="1.2s"
      fill="freeze"
      ease="ease-out"
    />
  </path>
</svg>
